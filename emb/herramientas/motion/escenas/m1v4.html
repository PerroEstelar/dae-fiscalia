function S_mapa(o){const T=blk(o.txt,o.cola);return {id:'MAPA',d:T.d,ov:16,
 build(r){r.style.background='#F7F7F8';this.cam=el('div','abs',r);Object.assign(this.cam.style,{left:0,top:0,width:'1920px',height:'1080px',transformOrigin:'960px 520px'});

   Object.assign(e.style,{left:p.x+'px',top:p.y+'px'});this.n.push({e,l,a:T.k(a[2])});});},
 draw(t,r){const d=this.d;r.style.opacity=E.inOutCubic(R(t,0,16));

  let act=-1;this.n.forEach((n,i)=>{if(t>=n.a)act=i;});
  this.n.forEach((n,i)=>{trazo(n.l,E.inOutCubic(R(t,n.a-8,n.a+12)));const kk=E.outBack(R(t,n.a,n.a+16),1.8);
   const on=i===act;n.l.setAttribute('stroke',t>=n.a?(on?'#DF1F15':'#ADB5BD'):'#CED4DA');
   n.e.style.opacity=R(t,n.a,n.a+6);n.e.style.transform=`translate(-50%,-50%) scale(${(0.6+0.4*kk)*(on?1.06:1)})`;});
  r.style.filter=`opacity(${1-R(t,d-10,d)})`;
 },subs:[[0,16]]};}

  txt:'La confianza se construye cuando hay razones para creer en una actuación. Mayer, Davis y Schoorman la relacionan con capacidad, consideración por las personas e integridad. Y en lo público se suma la continuidad: registros y responsables que sostienen un compromiso aunque cambie el equipo.',

 S_planos({id:'B3',entrada:'tren',

 S_planos({id:'B4',entrada:'amarillo',
  txt:'¿Qué hacer en el caso? Primero, confirmar el estado de la gestión. Luego, reconocer la demora, explicar lo que se puede verificar y acordar la próxima actualización con quien pueda asumirla. Sin prometer una fecha que no se conoce.',
  planos:[{clip:'D5',s:[1.08,1.02]},{clip:'G4',en:'Luego',s:[1.03,1.1]}],
  textos:[{html:G('¿Qué hacer en el caso?'),en:0,hasta:'Luego',top:820},

          {html:PL('2 · Reconocer la demora'),en:'reconocer la demora',top:200},

          {html:G('Sin prometer una fecha que no se conoce','#FFC400',52),en:'Sin prometer',top:820}]}),
 S_tarjetas({id:'B5',fondo:'G2_duo',en0:0,alto:520,

  cab:{tit:'Dos cosas para tener presentes'},
  items:[{tit:'Si hubo un error',def:'se corrige ante quienes recibieron la información.',ico:'check',en:'Si hubo'},

 S_actividad({titulo:'En la actividad',sub:'Formule su respuesta al caso.',
